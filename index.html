<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unit 12 Project</title>

  <body>
    <h1>Quiz about My Little Pony </h1>
    <hr />
    <!-- 1st Question -->
    <form id="magic-form">
      <label>
        ✨ Who is the element of Magic?
        <select id="magic-answer" name=type>
          <option value="magic1">Spike</option>
          <option value="magic2">Rarity</option>
          <option value="magic3">Princess Luna</option>
          <option value="magic4">Twilight Sparkle</option>
        </select>
      </label>
      <button type="submit">Check My Answer</button>
    </form>
    <div id="magic-result">
      <p id="magic-text"></p>
  
    </div>
    <hr />
    <!-- 2nd Question -->
    <form id="teacher-form">
      <label>
        ✨ Who is Twilight Sparkle's teacher?
        <select id="teacher-answer">
          <option value="teacher1">Discord</option>
          <option value="teacher2">Zecora</option>
          <option value="teacher3">Princess Celestia</option>
          <option value="teacher4">Granny Smith</option>
        </select>
      </label>
      <button type="submit">Check My Answer</button>
    </form>
    <div id="teacher-result">
      <p id="teacher-text"></p>
    </div>
    <!-- 3rd Question -->
    <form id="pony-form">
      <label>
        ✨ Who is my favorite pony?
        <select id="pony-answer">
          <option value="pony1">Applejack</option>
          <option value="pony2">Pinkie Pie</option>
          <option value="pony3">Fluttershy</option>
          <option value="pony4">Rainbow Dash</option>
        </select>
      </label>
      <button type="submit">Check My Answer</button>
    </form>
    <div id="pony-result">
      <p id="pony-text"></p>
    </div>
    <hr />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script>
      
      //========================Movie Question jQuery Code
      // $("#movie-form").on("submit", function (event) {
        // event.preventDefault();

        var $answer = $("#magic-answer");
        var answer = $answer.val();
        var magicImages = {
          magic1:
          "https://mediaproxy.tvtropes.org/width/1200/https://static.tvtropes.org/pmwiki/pub/images/spikeformer_suggestion_6.png",
          magic2:
          "https://static.wikia.nocookie.net/all-worlds-alliance/images/a/af/Rarity.png/revision/latest/scale-to-width-down/382?cb=20181221095805",
          magic3:
          "https://static.wikia.nocookie.net/characters/images/8/83/Princess_Luna.png/revision/latest?cb=20171010212421",
          magic4:
          "https://static.wikia.nocookie.net/characterprofile/images/c/c7/Twilight_Sparkle_Alicorn_vector.png/revision/latest?cb=20160104140556",
        };

        $("#magic-form").on("submit", function (event) {
          event.preventDefault();
          var $magicType = $(this).find("[name=type]");
          var magicType = $magicType.val();
          console.log(magicType);
          var $img = $("<img>");
          $img.width(100);
          $img.attr("src", magicImages[magicType]);
          $img.appendTo("#magic-result");


          var $pic = $("img");
          
          $pic.hide().slideDown();

          $pic.animate({
          width: "200px",
          marginLeft: "100px",
          borderWidth: "300px",
          
          },2000)
        


        if (magicType === "magic4") {
          $("#magic-text").text("YESSSS!");
        } 
        else {
          $("#magic-text").text("Try Again!");
        }
      });

      $("#hide").click(function(){
         $("p").hide();
      });

      //=======================Book Question jQuery Code
      $("#teacher-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#teacher-answer");
        var answer = $answer.val();


        if (answer === "teacher3") {
          $("#teacher-text").text("YESSSS!");
        } 
        else {
          $("#teacher-text").text("Try Again!");
        }
      });

      //========================Drink Question jQuery Code
      $("#pony-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#pony-answer");
        var answer = $answer.val();

        if (answer === "pony1") {
          $("#pony-text").text("YESSSS!");
        } 
        else {
          $("#pony-text").text("Try Again!");
        }
      });
      
    </script>
